services:
  backend:
    build: ./backend
    container_name: disease-prediction-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: disease-prediction-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
