services:
  # 1. Unified Web Service (Backend + Frontend)
  - type: web
    name: disease-predictor-backend
    env: python
    rootDir: .
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && uvicorn index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GOOGLE_PLACES_API_KEY
        sync: false # You will enter this securely in the Render Dashboard
