title: AI-Powered Disease Prediction Using Machine Learning
description: A comprehensive machine learning solution for disease prediction
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Exclude unnecessary directories from build
exclude:
  - .git
  - .gitignore
  - .venv
  - .vscode
  - api
  - backend
  - data
  - build
  - frontend
  - .github
  - node_modules
  - __pycache__
  - "*.pyc"
  - requirements.txt
  - package.json
  - docker-compose.yml
  - render.yaml
  - vercel.json
